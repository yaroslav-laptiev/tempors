services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://tempors:tempors@postgres:5432/tempors
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tempors
      POSTGRES_USER: tempors
      POSTGRES_PASSWORD: tempors
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tempors -d tempors"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
